<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login – Tool Manager</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <style>
    body {
      min-height: 100vh;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .login-logo {
      width: 100%;
      max-width: 420px;
      height: auto;
      margin-bottom: 32px;
    }
    .card {
      border: 1px solid #e5e5e5;
      border-radius: 6px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15);
    }
    .card-title-custom {
      color: #7a5c00;
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: 0.02em;
    }
    .input-icon {
      background: #f3ecc6;
      border: 1px solid #d8c98a;
      color: #8a7a3e;
    }
    .form-control.input-tan {
      background: #f3ecc6;
      border: 1px solid #d8c98a;
    }
    .form-control.input-tan:focus {
      background: #f3ecc6;
      border-color: #b8a45a;
      box-shadow: 0 0 0 0.2rem rgba(184, 164, 90, 0.25);
    }
    .btn-login {
      background: linear-gradient(135deg, #2c7ea1, #1f5f7d);
      border: none;
      color: #fff;
      letter-spacing: 0.03em;
    }
    .btn-login:hover {
      opacity: 0.9;
      color: #fff;
    }
  </style>
</head>
<body>
  <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Logo" class="login-logo">
  <div class="container" style="max-width: 420px;">
    <div class="card">
      <div class="card-body p-4">
        <div class="card-title-custom mb-3">VC Team Tool Management</div>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% for category, message in messages %}
            <div class="alert alert-{{ category }} alert-dismissible fade show py-2" role="alert">
              {{ message }}
              <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
          {% endfor %}
        {% endwith %}

        <form method="POST" novalidate>
          <div class="mb-3">
            <div class="input-group">
              <span class="input-group-text input-icon"><i class="bi bi-person-fill"></i></span>
              <input type="text" id="username" name="username" class="form-control input-tan"
                     placeholder="Login" required autofocus />
            </div>
          </div>
          <div class="mb-3">
            <div class="input-group">
              <span class="input-group-text input-icon"><i class="bi bi-key-fill"></i></span>
              <input type="password" id="password" name="password" class="form-control input-tan"
                     placeholder="Password" required />
            </div>
          </div>
          <div class="d-flex justify-content-end mb-3">
            <button type="submit" class="btn btn-login fw-semibold px-4">Sign In</button>
          </div>
        </form>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
