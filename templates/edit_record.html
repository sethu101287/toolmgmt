<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edit Record – Tool Manager</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <style>
    body { background: #f0f2f5; }
    .navbar { background: linear-gradient(135deg, #0f3460, #533483) !important; }
    .logo-badge { background: #fff; padding: 4px 8px; border-radius: 6px; display: inline-flex; align-items: center; }
    .card  { border: none; border-radius: 12px; box-shadow: 0 2px 16px rgba(0,0,0,.08); }
    .btn-save { background: linear-gradient(135deg, #0f3460, #533483); border: none; }
    .btn-save:hover { opacity: .9; }
    .form-control:focus { border-color: #533483; box-shadow: 0 0 0 .2rem rgba(83,52,131,.25); }
  </style>
</head>
<body>

  <nav class="navbar navbar-dark px-4 py-3">
    <span class="navbar-brand fw-bold fs-5 d-flex align-items-center gap-2">
      <span class="logo-badge"><img src="{{ url_for('static', filename='img/logo.png') }}" alt="Logo" height="28"></span>
      Tool Manager
    </span>
    <a href="{{ url_for('dashboard') }}" class="btn btn-outline-light btn-sm">
      <i class="bi bi-arrow-left me-1"></i> Back to Dashboard
    </a>
  </nav>

  <div class="container py-5" style="max-width: 540px;">

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
          {{ message }}
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
      {% endfor %}
    {% endwith %}

    <div class="card">
      <div class="card-header bg-white py-3">
        <h5 class="mb-0 fw-bold"><i class="bi bi-pencil-square text-warning me-2"></i>Edit Record</h5>
      </div>
      <div class="card-body p-4">
        <form method="POST" novalidate>
          <div class="mb-3">
            <label for="name" class="form-label fw-semibold">Name <span class="text-danger">*</span></label>
            <input type="text" id="name" name="name" class="form-control"
                   value="{{ record.name }}" required autofocus />
          </div>
          <div class="mb-4">
            <label for="link" class="form-label fw-semibold">Link <span class="text-danger">*</span></label>
            <input type="text" id="link" name="link" class="form-control"
                   value="{{ record.link }}" required
                   placeholder="https://example.com or D:\path\to\file.vbs" />
            <div class="form-text">Enter a URL or a full Windows file path (e.g. <code>D:\Scripts\run.vbs</code>).</div>
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-save btn-primary px-4 fw-semibold">
              <i class="bi bi-floppy me-1"></i> Update
            </button>
            <a href="{{ url_for('dashboard') }}" class="btn btn-secondary px-4">Cancel</a>
          </div>
        </form>
      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
