<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Test Status Report</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <style>
    body { background: #f0f2f5; font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif; }
    body.embedded { background: #fff; }
    .card-soft { border: none; border-radius: 12px; box-shadow: 0 2px 16px rgba(0,0,0,.08); }
    #instanceSelect[disabled] { background: #e9ecef; }
  </style>
</head>
<body class="{{ 'embedded' if embedded else '' }}">
  <div class="container-fluid py-3 px-3">
    <div class="mb-3 d-flex justify-content-between align-items-center flex-wrap gap-2">
      <div>
        <div class="h4 mb-0"><i class="bi bi-file-earmark-excel me-2"></i>Test Status Report</div>
        <div class="text-muted small">Select instance(s) and a date range, then download the report as Excel.</div>
      </div>
      <a href="{{ url_for('reports_hub', embedded=1 if embedded else 0) }}" class="btn btn-outline-secondary btn-sm">
        <i class="bi bi-arrow-left me-1"></i>Back to Reports
      </a>
    </div>

    {% if error %}
      <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    <div class="card card-soft">
      <div class="card-body">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label fw-semibold">Instance ID</label>
            <div class="form-check mb-2">
              <input class="form-check-input" type="checkbox" id="allInstances" checked>
              <label class="form-check-label" for="allInstances">All Instances</label>
            </div>
            <select class="form-select" id="instanceSelect" multiple size="8" disabled>
              {% for instance_id in instance_ids %}
              <option value="{{ instance_id }}">{{ instance_id }}</option>
              {% endfor %}
            </select>
            <div class="form-text">Hold Ctrl (Cmd on Mac) to select multiple instances.</div>
          </div>
          <div class="col-md-3">
            <label class="form-label fw-semibold">Start Date</label>
            <input type="date" class="form-control" id="startDate" required>
          </div>
          <div class="col-md-3">
            <label class="form-label fw-semibold">End Date</label>
            <input type="date" class="form-control" id="endDate" required>
          </div>
        </div>
        <div class="mt-4">
          <button type="button" class="btn btn-success" id="btnDownload">
            <i class="bi bi-download me-1"></i>Download Excel
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const allInstancesCheckbox = document.getElementById('allInstances');
    const instanceSelect = document.getElementById('instanceSelect');

    allInstancesCheckbox.addEventListener('change', () => {
      if (allInstancesCheckbox.checked) {
        instanceSelect.disabled = true;
        Array.from(instanceSelect.options).forEach((opt) => { opt.selected = false; });
      } else {
        instanceSelect.disabled = false;
      }
    });

    document.getElementById('btnDownload').addEventListener('click', () => {
      const startDate = document.getElementById('startDate').value;
      const endDate = document.getElementById('endDate').value;
      if (!startDate || !endDate) {
        alert('Please select both Start Date and End Date.');
        return;
      }
      if (startDate > endDate) {
        alert('Start Date must be on or before End Date.');
        return;
      }

      const params = new URLSearchParams({ start_date: startDate, end_date: endDate });
      if (!allInstancesCheckbox.checked) {
        Array.from(instanceSelect.selectedOptions).forEach((opt) => params.append('instance_id', opt.value));
      }
      window.location.href = '/reports/test-status/export?' + params.toString();
    });
  </script>
</body>
</html>
